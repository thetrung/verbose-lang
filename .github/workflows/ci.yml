name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install toolchain (clang, curl)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang curl

      - name: Build self-hosted compiler (Stage 1 -> Stage 2 -> Stage 3 fixpoint)
        run: make build

      - name: Run self-hosted pure-VerBose test suite (./verbose test)
        run: make test

      - name: Verify install & dist packaging
        run: |
          make install DESTDIR=/tmp/vb-stage PREFIX=/usr/local
          /tmp/vb-stage/usr/local/bin/verbose --version
          make dist
          cat dist/SHA256SUMS.txt
