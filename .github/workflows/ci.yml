name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain (clang, python3, curl)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang python3 curl

      - name: Build self-hosted compiler (Stage 1 -> Stage 2 -> Stage 3 fixpoint)
        run: make build

      - name: Run self-hosted compiler test suite (CLI, examples, semantic & negative checks)
        run: make test

      - name: Run all standalone examples via ./verbose
        run: make demo

      - name: Verify install & dist packaging
        run: |
          make install DESTDIR=/tmp/vb-stage PREFIX=/usr/local
          /tmp/vb-stage/usr/local/bin/verbose --version
          make dist
          cat dist/SHA256SUMS.txt
