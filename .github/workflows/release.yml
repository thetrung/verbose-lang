name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain (clang, python3, curl)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang python3 curl

      - name: Build Self-Hosted Compiler + Full Test Suite
        run: |
          make test-all
          make dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/verbose dist/verbose-linux-x86_64 dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG_NAME" \
              dist/verbose dist/verbose-linux-x86_64 dist/SHA256SUMS.txt \
              --title "VerBose-Lang $TAG_NAME (Linux x86-64)" \
              --generate-notes
          fi
