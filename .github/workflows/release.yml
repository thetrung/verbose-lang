name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.5.1)'
        required: true

permissions:
  contents: write

jobs:
  bootstrap-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain (clang, curl)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang curl

      - name: Build Linux x86-64 compiler, run full test suite, and package dist
        run: |
          make test-all
          make dist

      - name: Cross-emit LLVM IR bootstrap files for arm64, macOS, and Windows
        run: |
          mkdir -p cross-ir
          ./verbose src/verbose.vb --target linux-arm64 --emit-only -o cross-ir/verbose-linux-arm64.ll
          ./verbose src/verbose.vb --target macos-arm64 --emit-only -o cross-ir/verbose-macos-arm64.ll
          ./verbose src/verbose.vb --target windows-x86_64 --emit-only -o cross-ir/verbose-windows-x86_64.ll
          ls -lh cross-ir/

      - name: Upload Linux x86-64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-x86_64
          path: |
            dist/verbose
            dist/verbose-linux-x86_64

      - name: Upload cross-target bootstrap IR
        uses: actions/upload-artifact@v4
        with:
          name: cross-ir
          path: cross-ir/*.ll

  build-linux-arm64:
    needs: bootstrap-linux-x86_64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain (clang)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Download cross-emitted linux-arm64 LLVM IR
        uses: actions/download-artifact@v4
        with:
          name: cross-ir
          path: cross-ir

      - name: Native Stage 1->2->3 self-hosting fixpoint + full test suite + dist
        run: |
          clang -O2 cross-ir/verbose-linux-arm64.ll -o ./.verbose.boot
          make build BOOTSTRAP=./.verbose.boot
          make test
          make dist

      - name: Upload Linux arm64 binary
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-arm64
          path: dist/verbose-linux-arm64

  build-macos-arm64:
    needs: bootstrap-linux-x86_64
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download cross-emitted macos-arm64 LLVM IR
        uses: actions/download-artifact@v4
        with:
          name: cross-ir
          path: cross-ir

      - name: Native Stage 1->2->3 self-hosting fixpoint + full test suite + dist
        run: |
          clang -O2 cross-ir/verbose-macos-arm64.ll -o ./.verbose.boot
          make build BOOTSTRAP=./.verbose.boot
          make test
          make dist

      - name: Upload macOS arm64 binary
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos-arm64
          path: dist/verbose-macos-arm64

  build-windows-x86_64:
    needs: bootstrap-linux-x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 CLANG64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: >-
            mingw-w64-clang-x86_64-clang
            make
            diffutils

      - name: Download cross-emitted windows-x86_64 LLVM IR
        uses: actions/download-artifact@v4
        with:
          name: cross-ir
          path: cross-ir

      - name: Native Stage 1->2->3 self-hosting fixpoint + tests + dist
        run: |
          clang -O2 cross-ir/verbose-windows-x86_64.ll -o ./.verbose.boot.exe
          make build BOOTSTRAP=./.verbose.boot.exe
          ./verbose.exe test tests/test_core.vb
          ./verbose.exe test tests/test_c_interop.vb
          ./verbose.exe test tests/test_arena.vb
          ./verbose.exe test tests/test_arrays.vb
          ./verbose.exe test tests/test_byref.vb
          ./verbose.exe test tests/test_std_collections.vb
          ./verbose.exe test tests/test_std_math.vb
          ./verbose.exe test tests/test_std_strings.vb
          ./verbose.exe prototype.vb
          make dist

      - name: Upload Windows x86-64 binary
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows-x86_64
          path: dist/verbose-windows-x86_64.exe

  publish:
    needs:
      - bootstrap-linux-x86_64
      - build-linux-arm64
      - build-macos-arm64
      - build-windows-x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate unified SHA256SUMS.txt
        run: |
          cd release-assets
          chmod +x verbose verbose-linux-x86_64 verbose-linux-arm64 verbose-macos-arm64
          sha256sum \
            verbose \
            verbose-linux-x86_64 \
            verbose-linux-arm64 \
            verbose-macos-arm64 \
            verbose-windows-x86_64.exe \
            > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          ASSETS="release-assets/verbose release-assets/verbose-linux-x86_64 release-assets/verbose-linux-arm64 release-assets/verbose-macos-arm64 release-assets/verbose-windows-x86_64.exe release-assets/SHA256SUMS.txt"
          if gh release view "$TAG_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" $ASSETS --repo "$GH_REPO" --clobber
          else
            gh release create "$TAG_NAME" $ASSETS \
              --repo "$GH_REPO" \
              --title "VerBose-Lang $TAG_NAME" \
              --generate-notes
          fi
